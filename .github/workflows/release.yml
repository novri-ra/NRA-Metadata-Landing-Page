name: Build and Release

on:
  push:
    branches:
      - main
      - development
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

          echo "ðŸ”’ Obfuscating main JavaScript files..."
          mkdir -p obfuscated
          mkdir -p obfuscated/src/background
          mkdir -p obfuscated/src/content
          mkdir -p obfuscated/src/sidepanel
          mkdir -p obfuscated/src/utils
          mkdir -p obfuscated/assets

          # Only obfuscate files with business logic
          FILES_TO_OBFUSCATE="src/background/background.js src/content/content.js src/sidepanel/panel.js"

          echo "🔒 Obfuscating main JavaScript files..."
          mkdir -p obfuscated

          # Only obfuscate files with business logic
          FILES_TO_OBFUSCATE="background.js content.js panel.js"

          for file in $FILES_TO_OBFUSCATE; do
            if [ -f "$file" ]; then
              echo "   🔒 Obfuscating $file..."
              javascript-obfuscator "$file" --output "obfuscated/$file" \
                --compact true \
                --control-flow-flattening true \
                --control-flow-flattening-threshold 0.75 \
                --dead-code-injection true \
                --dead-code-injection-threshold 0.4 \
                --debug-protection true \
                --disable-console-output false \
                --identifier-names-generator mangled \
                --rename-globals false \
                --self-defending true \
                --string-array true \
                --string-array-encoding rc4 \
                --string-array-threshold 0.75 \
                --transform-object-keys false \
          # Copy selectors.js as-is (only constants, no business logic)
          if [ -f src/content/selectors.js ]; then
            echo "ðŸ“„ Copying selectors.js (no obfuscation needed)..."
            cp src/content/selectors.js obfuscated/src/content/
          fi

          # Copy utils.js if exists (with light obfuscation)
          if [ -f src/utils/utils.js ]; then
            echo "ðŸ”’ Obfuscating utils.js..."
            javascript-obfuscator src/utils/utils.js --output "obfuscated/src/utils/utils.js" \
          fi

          # Copy utils.js if exists (with light obfuscation)
          if [ -f utils.js ]; then
            echo "🔒 Obfuscating utils.js..."
            javascript-obfuscator utils.js --output "obfuscated/utils.js" \
          fi
          
          if [ -f src/utils/rename.js ]; then
            cp src/utils/rename.js obfuscated/src/utils/
          fi

          echo "ðŸ“‹ Copying non-JS files..."
          cp manifest.json obfuscated/
          cp src/sidepanel/panel.html obfuscated/src/sidepanel/
          cp assets/icon.png obfuscated/assets/
          cp README.md obfuscated/
          cp panel.html obfuscated/
          cp icon.png obfuscated/
          cp README.md obfuscated/

          if [ -f icon.html ]; then
            cp icon.html obfuscated/
          fi

          echo "✅ Build complete!"

      - name: Create extension package
        run: |
          echo "📦 Creating extension package..."
          cd obfuscated
          zip -r ../canva-auto-prompter-${GITHUB_REF_NAME#v}.zip .
          cd ..

          if [ -f canva-auto-prompter-${GITHUB_REF_NAME#v}.zip ]; then
            echo "✅ Zip created: canva-auto-prompter-${GITHUB_REF_NAME#v}.zip"
            ls -lh canva-auto-prompter-${GITHUB_REF_NAME#v}.zip
          else
            echo "❌ ERROR: Failed to create zip file!"
            exit 1
          fi

          rm -rf obfuscated
          echo "✅ Build complete!"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: canva-auto-prompter-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

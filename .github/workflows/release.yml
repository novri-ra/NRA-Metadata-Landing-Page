name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Obfuscator
        run: |
          npm install -g javascript-obfuscator

      - name: Obfuscate JavaScript files
        run: |
          echo "🔒 Obfuscating JavaScript files..."
          mkdir -p obfuscated

          # List of JS files to obfuscate
          JS_FILES="background.js content.js panel.js selectors.js"

          for file in $JS_FILES; do
            if [ -f "$file" ]; then
              echo "   Obfuscating $file..."
              javascript-obfuscator "$file" --output "obfuscated/$file" \
                --compact true \
                --control-flow-flattening true \
                --control-flow-flattening-threshold 0.75 \
                --dead-code-injection true \
                --dead-code-injection-threshold 0.4 \
                --debug-protection true \
                --disable-console-output false \
                --identifier-names-generator mangled \
                --rename-globals true \
                --self-defending true \
                --string-array true \
                --string-array-encoding rc4 \
                --string-array-threshold 0.75 \
                --transform-object-keys true \
                --unicode-escape-sequence false
            else
              echo "⚠️ $file not found, skipping..."
            fi
          done

          # Handle utils.js if exists
          if [ -f utils.js ]; then
            echo "   Obfuscating utils.js..."
            javascript-obfuscator utils.js --output "obfuscated/utils.js" \
              --compact true \
              --control-flow-flattening true \
              --control-flow-flattening-threshold 0.75 \
              --dead-code-injection true \
              --dead-code-injection-threshold 0.4 \
              --self-defending true \
              --string-array true \
              --string-array-encoding rc4
          fi

          echo "📋 Copying non-JS files..."
          cp manifest.json obfuscated/
          cp panel.html obfuscated/
          cp icon.png obfuscated/
          cp README.md obfuscated/

          if [ -f icon.html ]; then
            cp icon.html obfuscated/
          fi

          echo "✅ Obfuscation complete!"

      - name: Create extension package
        run: |
          echo "📦 Creating extension package..."
          cd obfuscated
          zip -r ../canva-auto-prompter-${GITHUB_REF_NAME#v}.zip .
          cd ..

          if [ -f canva-auto-prompter-${GITHUB_REF_NAME#v}.zip ]; then
            echo "✅ Zip created: canva-auto-prompter-${GITHUB_REF_NAME#v}.zip"
            ls -lh canva-auto-prompter-${GITHUB_REF_NAME#v}.zip
          else
            echo "❌ ERROR: Failed to create zip file!"
            exit 1
          fi

          rm -rf obfuscated
          echo "✅ Build complete!"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: canva-auto-prompter-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

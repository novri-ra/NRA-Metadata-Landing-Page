name: Build & Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download UPX for Compression
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile "upx.zip"
          Expand-Archive -Path "upx.zip" -DestinationPath "upx_dir"
          Move-Item -Path "upx_dir/upx-*" -Destination "upx"

      - name: Ensure Tools Directory Exists
        run: mkdir -p tools
        shell: bash

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "NRA-Metadata" --paths "." --collect-all "packages" --collect-all "backend" --collect-all "customtkinter" --upx-dir "upx" --add-data "tools;tools" apps/desktop/src/main.py

      - name: Prepare Distribution Package
        shell: pwsh
        run: |
          if (!(Test-Path "dist/NRA-Metadata/tools")) {
              New-Item -ItemType Directory -Force -Path "dist/NRA-Metadata/tools"
          }
          if (Test-Path "tools") {
              Copy-Item -Path "tools/*" -Destination "dist/NRA-Metadata/tools/" -Recurse -Force
          }
          Compress-Archive -Path "dist/NRA-Metadata" -DestinationPath "NRA-Metadata-Portable.zip" -CompressionLevel Optimal

      - name: Prune Old Releases and Tags
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Checking and deleting older releases..."
          $releases = gh release list --limit 30 --json tagName -q '.[].tagName' | Out-String
          $releaseList = $releases.Trim() -split "\r?\n" | Where-Object { $_ -ne "" }
          foreach ($rel in $releaseList) {
              Write-Host "Deleting old release: $rel"
              gh release delete $rel --yes --cleanup-tag
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NRA-Metadata v1.0.${{ github.run_number }} (Portable)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: NRA-Metadata-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

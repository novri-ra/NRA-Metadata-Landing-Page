name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create extension package
        run: |
          echo "📦 Creating extension package..."

          mkdir -p temp/canva-auto-prompter

          echo "📋 Copying files..."
          cp background.js temp/canva-auto-prompter/ 2>/dev/null || echo "⚠️ background.js not found"
          cp content.js temp/canva-auto-prompter/ 2>/dev/null || echo "⚠️ content.js not found"
          cp panel.js temp/canva-auto-prompter/ 2>/dev/null || echo "⚠️ panel.js not found"
          cp panel.html temp/canva-auto-prompter/ 2>/dev/null || echo "⚠️ panel.html not found"
          cp selectors.js temp/canva-auto-prompter/ 2>/dev/null || echo "⚠️ selectors.js not found"
          cp manifest.json temp/canva-auto-prompter/ 2>/dev/null || echo "⚠️ manifest.json not found"
          cp icon.png temp/canva-auto-prompter/ 2>/dev/null || echo "⚠️ icon.png not found"
          cp README.md temp/canva-auto-prompter/ 2>/dev/null || echo "⚠️ README.md not found"

          if [ -f utils.js ]; then
            cp utils.js temp/canva-auto-prompter/
            echo "✅ utils.js copied"
          fi

          if [ -f icon.html ]; then
            cp icon.html temp/canva-auto-prompter/
            echo "✅ icon.html copied"
          fi

          if [ -z "$(ls -A temp/canva-auto-prompter)" ]; then
            echo "❌ ERROR: No files were copied!"
            exit 1
          fi

          echo "📦 Creating zip archive..."
          cd temp
          zip -r ../canva-auto-prompter-${GITHUB_REF_NAME#v}.zip canva-auto-prompter/
          cd ..

          if [ -f canva-auto-prompter-${GITHUB_REF_NAME#v}.zip ]; then
            echo "✅ Zip created: canva-auto-prompter-${GITHUB_REF_NAME#v}.zip"
            ls -lh canva-auto-prompter-${GITHUB_REF_NAME#v}.zip
          else
            echo "❌ ERROR: Failed to create zip file!"
            exit 1
          fi

          rm -rf temp
          echo "✅ Build complete!"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: canva-auto-prompter-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

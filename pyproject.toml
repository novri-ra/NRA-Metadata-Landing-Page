[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nra-metadata"
version = "0.1.0"
description = "Auto Metadata Generator & Embedder"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
    "google-genai>=0.1.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "pyinstaller>=6.0.0",
    "svglib>=1.5.1",
    "reportlab>=4.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canva Auto Prompter Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d0b18 0%, #120e24 100%);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --input-bg: rgba(15, 12, 27, 0.6);
      --input-border: rgba(255, 255, 255, 0.08);
      --input-focus: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-width: 280px;
      padding: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-gradient);
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 10px;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      height: 120px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--input-focus);
    }

    select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 14px;
    }

    select:focus {
      border-color: var(--input-focus);
    }

    option {
      background: #120e24;
      color: var(--text-main);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      margin-top: 12px;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      margin-right: 6px;
    }

    .status-dot.active {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">C</div>
    <div>
      <h1>Canva Auto Prompter</h1>
      <div class="tagline">AI & Dream Lab Side Panel</div>
    </div>
  </header>

  <div class="card">
    <div class="form-group">
      <label for="promptInput">Prompt Text</label>
      <textarea id="promptInput" rows="10" placeholder="Paste multiple prompts here (one per line)..."></textarea>
      <div id="progressText" style="font-weight: 600; margin-top: 8px; margin-bottom: 4px; font-size: 11px; color: var(--text-main);">Progress: 0 / 0</div>
    </div>

    <div class="form-group">
      <label for="aspectRatio">Aspect Ratio</label>
      <select id="aspectRatio">
        <option value="1:1" selected>1:1</option>
        <option value="16:9">16:9</option>
        <option value="9:16">9:16</option>
        <option value="3:4">3:4</option>
        <option value="4:3">4:3</option>
        <option value="2:1">2:1</option>
      </select>
    </div>

    <div class="form-group">
      <label for="imageStyle">Image Style</label>
      <select id="imageStyle">
        <option value="None">None</option>
        <option value="3D Render">3D Render</option>
        <option value="Cinematic">Cinematic</option>
        <option value="Bokeh">Bokeh</option>
        <option value="Sketch - Color">Sketch - Color</option>
        <option value="Sketch - Black & White">Sketch - Black & White</option>
      </select>
    </div>

    <div class="form-group">
      <label for="downloadCount">Download Count</label>
      <select id="downloadCount">
        <option value="4" selected>4</option>
        <option value="3">3</option>
        <option value="2">2</option>
        <option value="1">1</option>
        <option value="Random">Random</option>
      </select>
    </div>
  </div>

  <button class="btn" id="startBtn">Run</button>

  <div class="card" style="margin-top: 14px; border-color: rgba(231, 76, 60, 0.25);">
    <div class="form-group">
      <label for="failedPrompts" style="color: #e74c3c;">Failed / Skipped Prompts</label>
      <textarea id="failedPrompts" readonly rows="3" placeholder="Any blocked or failed prompts will appear here..." style="border-color: #e74c3c;"></textarea>
    </div>
  </div>

  <div class="status-bar">
    <span>Status:</span>
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </div>

  <div style="text-align: center; font-size: 10px; color: #888888; margin-top: 16px; margin-bottom: 8px; line-height: 1.5;">
    <div>© 2026 Novri Rizki Akbar. All rights reserved.</div>
    <div>Support & Premium Products: <a href="https://lynk.id/novri-ra" target="_blank" style="color: #a87ffb; text-decoration: none; font-weight: bold;">lynk.id/novri-ra</a></div>
  </div>

  <script src="panel.js"></script>
</body>
</html>

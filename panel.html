<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canva Auto Prompter Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-width: 280px;
      padding: 16px;
      font-family: 'Press Start 2P', monospace;
      background-color: #0f172a;
      color: #cbd5e1;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle CRT screen scanlines effect styled for slate blue */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(15, 23, 42, 0) 50%, rgba(2, 6, 23, 0.2) 50%);
      background-size: 100% 4px;
      z-index: 9999;
      pointer-events: none;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #6366f1;
      border: 2px solid #334155;
      box-shadow: 4px 4px 0px #020617;
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: #ffffff;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .tagline {
      font-family: 'VT323', monospace;
      font-size: 14px;
      color: #cbd5e1;
      opacity: 0.7;
      margin-top: 4px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 12px;
      background-color: #1e293b;
      border: 2px solid #334155;
      margin-bottom: 20px;
      color: #cbd5e1;
      box-shadow: 4px 4px 0px #020617;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 0;
      background-color: #ef4444 !important;
      /* Inactive/Error */
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
      border: 2px solid #020617;
    }

    .status-dot.active {
      background-color: #4ade80 !important;
      /* Active */
    }

    .card {
      background-color: #1e293b;
      border: 2px solid #334155;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 4px 4px 0px #020617;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      height: 120px;
      background-color: #020617;
      border: 2px solid #475569;
      color: #4ade80;
      padding: 8px 10px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      outline: none;
      resize: vertical;
    }

    textarea:focus {
      border-color: #4ade80;
    }

    select {
      width: 100%;
      background-color: #020617;
      border: 2px solid #475569;
      color: #4ade80;
      padding: 8px 10px;
      font-family: 'VT323', monospace;
      font-size: 18px;
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='8' height='8' viewBox='0 0 8 8'%3E%3Cpath d='M0 2h8L4 6z' fill='%234ade80'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 12px;
      image-rendering: pixelated;
    }

    select:focus {
      border-color: #4ade80;
    }

    option {
      background-color: #020617;
      color: #4ade80;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: #6366f1;
      border: 2px solid #6366f1;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 0px #312e81;
      text-transform: uppercase;
      display: block;
      text-align: center;
    }

    .btn:hover {
      opacity: 0.95;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #312e81;
    }

    /* StartBtn stop-mode override to remain inside the Midnight Ergonomic palette */
    #startBtn[style*="background"] {
      background-color: #ef4444 !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      box-shadow: 4px 4px 0px #991b1b !important;
    }

    #startBtn[style*="background"]:active {
      transform: translate(2px, 2px) !important;
      box-shadow: 2px 2px 0px #991b1b !important;
    }

    .progress-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #4ade80;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    /* CSS Accordion / Collapsible Section Styles */
    .toggle-cb {
      display: none;
    }

    .toggle-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 12px;
      background-color: #1e293b;
      border: 2px solid #334155;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #cbd5e1;
      user-select: none;
      box-shadow: 4px 4px 0px #020617;
    }

    .toggle-content.card {
      margin-top: 8px;
      margin-bottom: 0px;
    }

    .toggle-cb:checked~.toggle-content {
      display: block;
    }

    .toggle-cb:not(:checked)~.toggle-content {
      display: none;
    }

    .toggle-cb:checked+.toggle-label .icon::after {
      content: "[-]";
      color: #4ade80;
    }

    .toggle-cb:not(:checked)+.toggle-label .icon::after {
      content: "[+]";
      color: #ef4444;
    }

    .footer {
      text-align: center;
      font-family: 'VT323', monospace;
      font-size: 14px;
      color: #cbd5e1;
      opacity: 0.7;
      margin-top: 24px;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .footer a {
      color: #6366f1;
      text-decoration: underline;
      font-weight: bold;
    }

    .footer a:hover {
      opacity: 0.9;
    }

    /* Retro Pixel Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #020617;
      border-left: 2px solid #475569;
    }

    ::-webkit-scrollbar-thumb {
      background: #475569;
      border: 2px solid #020617;
    }

    .terminal-box {
      background: #020617;
      border: 2px solid #475569;
      height: 140px;
      overflow-y: auto;
      padding: 10px;
      font-family: 'VT323', monospace;
      font-size: 16px;
      white-space: pre-wrap;
    }

    .log-entry {
      margin-bottom: 10px;
      line-height: 1.3;
    }

    /* Added enter/spacing */
    .log-info {
      color: #4ade80;
    }

    .log-warn {
      color: #fbbf24;
    }

    .log-error {
      color: #ef4444;
      font-weight: bold;
    }

    /* Utility Icon Buttons */
    .icon-btn {
      background: none;
      border: none;
      color: #4ade80;
      cursor: pointer;
      font-size: 16px;
      margin-left: 10px;
      padding: 4px 6px;
      transition: opacity 0.2s, transform 0.1s;
      line-height: 1;
    }

    .icon-btn:hover {
      opacity: 0.7;
      transform: scale(1.1);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">C</div>
    <div style="flex: 1;">
      <h1>Canva Auto Prompter</h1>
      <div class="tagline">AI & Dream Lab Side Panel</div>
    </div>
    <button id="openDreamLabBtn" class="icon-btn" title="Open Dream Lab">🚀</button>
  </header>

  <!-- Status Bar at the Top -->
  <div class="status-bar">
    <span>Status:</span>
    <div>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Disconnected</span>
    </div>
  </div>

  <!-- Primary Section (Always Visible) -->
  <div class="card">
    <div class="form-group">
      <div class="header-flex">
        <label for="promptInput">Prompt Text</label>
        <button id="clearPromptsBtn" class="icon-btn" title="Clear all prompts">🗑️</button>
      </div>
      <textarea id="promptInput" rows="10" placeholder="Paste multiple prompts here (one per line)..."></textarea>
      <div id="progressText" class="progress-text">Progress: 0 / 0</div>
    </div>
  </div>

  <!-- Secondary Section: Settings (Collapsible Accordion, Default Expanded) -->
  <div class="accordion-item" style="margin-bottom: 20px;">
    <input type="checkbox" id="settingsToggle" class="toggle-cb" checked>
    <label for="settingsToggle" class="toggle-label">
      <span>Settings</span>
      <span class="icon"></span>
    </label>
    <div class="toggle-content card">
      <div class="form-group">
        <label for="aspectRatio">Aspect Ratio</label>
        <select id="aspectRatio">
          <option value="1:1" selected>1:1</option>
          <option value="16:9">16:9</option>
          <option value="9:16">9:16</option>
          <option value="3:4">3:4</option>
          <option value="4:3">4:3</option>
          <option value="2:1">2:1</option>
        </select>
      </div>

      <div class="form-group">
        <label for="imageStyle">Image Style</label>
        <select id="imageStyle">
          <option value="None">None</option>
          <option value="3D Render">3D Render</option>
          <option value="Cinematic">Cinematic</option>
          <option value="Bokeh">Bokeh</option>
          <option value="Sketch - Color">Sketch - Color</option>
          <option value="Sketch - Black & White">Sketch - Black & White</option>
        </select>
      </div>

      <div class="form-group">
        <label for="downloadCount">Download Count</label>
        <select id="downloadCount">
          <option value="4" selected>4</option>
          <option value="3">3</option>
          <option value="2">2</option>
          <option value="1">1</option>
          <option value="Random">Random</option>
        </select>
      </div>

      <div class="form-group">
        <label for="debugMode">Debug Mode</label>
        <select id="debugMode">
          <option value="false" selected>Off (Clean Logs)</option>
          <option value="true">On (Verbose Logs)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Main Action Button -->
  <button class="btn" id="startBtn" style="margin-bottom: 20px;">Run</button>

  <!-- Collapsible Terminal Logs (Default Expanded) -->
  <div class="accordion-item" style="margin-bottom: 20px;">
    <input type="checkbox" id="toggle-console" class="toggle-cb" checked>
    <label for="toggle-console" class="toggle-label" style="border-color: #4ade80; color: #4ade80;">
      <span style="display: flex; align-items: center;">
        <span>TERMINAL LOGS</span>
        <button id="clearLogsBtn" class="icon-btn" title="Clear logs"
          style="margin-left: 10px; font-size: 14px;">🗑️</button>
      </span>
      <span class="icon"></span>
    </label>
    <div class="toggle-content card" style="border-color: #4ade80;">
      <div class="form-group">
        <div id="consoleLogs" class="terminal-box"></div>
      </div>
    </div>
  </div>

  <!-- Tertiary Section: Failed Prompts (Collapsible Accordion, Default Collapsed) -->
  <div class="accordion-item" style="margin-bottom: 20px;">
    <input type="checkbox" id="failedToggle" class="toggle-cb">
    <label for="failedToggle" class="toggle-label" style="border-color: #991b1b; color: #fca5a5;">
      <span>Failed Prompts</span>
      <span class="icon"></span>
    </label>
    <div class="toggle-content card" style="border-color: #991b1b;">
      <div class="form-group">
        <label for="failedPrompts" style="color: #fca5a5;">Failed / Skipped Prompts</label>
        <textarea id="failedPrompts" readonly rows="3" placeholder="Any blocked or failed prompts will appear here..."
          style="border-color: #991b1b; color: #fca5a5;"></textarea>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div>© 2026 Novri Rizki Akbar. All rights reserved.</div>
    <div>Support & Premium Products: <a href="https://lynk.id/novri-ra" target="_blank">lynk.id/novri-ra</a></div>
  </div>

  <script src="panel.js"></script>
</body>

</html>
